services:
  web:
    build: .
    container_name: aibazar-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=3000
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .env.production:/app/.env:ro
