name: Verify and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aibazar-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check TypeScript
        run: npm run typecheck

  deploy:
    name: Deploy to server
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ secrets.APP_DIR }}
      GH_SYNC_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          key_path="$RUNNER_TEMP/aibazar_deploy_key"
          known_hosts_path="$RUNNER_TEMP/aibazar_known_hosts"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"

          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_path"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$known_hosts_path"
          fi
          chmod 600 "$known_hosts_path"

      - name: Synchronize files over SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          key_path="$RUNNER_TEMP/aibazar_deploy_key"
          known_hosts_path="$RUNNER_TEMP/aibazar_known_hosts"
          ssh_transport="ssh -i $key_path -p $SSH_PORT -o BatchMode=yes -o UserKnownHostsFile=$known_hosts_path -o StrictHostKeyChecking=yes"

          $ssh_transport "$SSH_USER@$SSH_HOST" \
            "test -d '$APP_DIR' && test -w '$APP_DIR' || { echo 'APP_DIR does not exist or is not writable: $APP_DIR' >&2; exit 1; }"

          rsync -rlptDz --delete --itemize-changes \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage/' \
            -e "$ssh_transport" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Apply database changes and restart application
        shell: bash
        run: |
          set -Eeuo pipefail
          key_path="$RUNNER_TEMP/aibazar_deploy_key"
          known_hosts_path="$RUNNER_TEMP/aibazar_known_hosts"
          remote_command="read -r GITHUB_TOKEN; export GITHUB_TOKEN; cd '$APP_DIR' && chmod +x scripts/deploy-server.sh && ./scripts/deploy-server.sh"

          printf '%s\n' "$GH_SYNC_TOKEN" | ssh \
            -i "$key_path" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command"
